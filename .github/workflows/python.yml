name: Python

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  POETRY_VERSION: "2.3.2"

jobs:
  package:
    name: Package and wheel metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Poetry
        run: pipx install --force "poetry==$POETRY_VERSION"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: poetry
          cache-dependency-path: poetry.lock

      - name: Install locked dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Validate project metadata and lock file
        run: poetry check --lock

      - name: Build a clean wheel
        run: poetry build --clean --format wheel --no-interaction --no-ansi

      - name: Test source and installed metadata
        run: poetry run pytest -q tests/test_package_metadata.py

      - name: Test the wheel in a clean environment
        shell: bash
        run: |
          wheel_paths=("$GITHUB_WORKSPACE"/dist/*.whl)
          if [[ ${#wheel_paths[@]} -ne 1 || ! -f "${wheel_paths[0]}" ]]; then
            echo "Expected exactly one wheel in dist/." >&2
            exit 1
          fi

          wheel_env="$RUNNER_TEMP/chronofy-wheel"
          python -m venv "$wheel_env"
          "$wheel_env/bin/python" -m pip install \
            --disable-pip-version-check \
            "${wheel_paths[0]}" \
            "packaging>=24,<27" \
            "pytest>=8,<9"

          cp "$GITHUB_WORKSPACE/tests/test_package_metadata.py" "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          "$wheel_env/bin/python" -m pytest -q test_package_metadata.py

  tests:
    name: Tests / Python ${{ matrix.python }} / ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            extras: graph sl
            profile: standard extras
          - python: "3.11"
            extras: graph sl
            profile: standard extras
          - python: "3.12"
            extras: all
            profile: all extras

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Poetry
        run: pipx install --force "poetry==$POETRY_VERSION"

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: poetry
          cache-dependency-path: poetry.lock

      - name: Install locked test dependencies
        run: >-
          poetry install
          --extras "${{ matrix.extras }}"
          --no-interaction
          --no-ansi

      - name: Execute README examples
        run: poetry run pytest -q tests/test_readme_examples.py

      - name: Run the full test suite with coverage
        run: >-
          poetry run pytest tests
          --cov=chronofy
          --cov-report=term-missing

  quality:
    name: Ruff and strict mypy
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Poetry
        run: pipx install --force "poetry==$POETRY_VERSION"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: poetry
          cache-dependency-path: poetry.lock

      - name: Install locked quality dependencies
        run: poetry install --all-extras --no-interaction --no-ansi

      - name: Run Ruff
        run: poetry run ruff check chronofy tests

      - name: Run strict mypy
        run: poetry run mypy --strict chronofy

      - name: Validate tracked experiment sources and synthetic fixture
        run: |
          poetry run ruff check experiments
          poetry run python -B experiments/validate.py
